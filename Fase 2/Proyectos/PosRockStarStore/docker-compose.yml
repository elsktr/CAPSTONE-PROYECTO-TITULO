# POS Rockstar Store en Docker.
#
#   docker compose up --build    levanta el POS en http://localhost:8082
#   docker compose down          detiene y conserva todo (no hay volumen propio)
#
# Requiere que el proyecto Rockstar este corriendo
# (App-mobile-docker-backend: db + api + app + tienda).
# Este compose se une a su red `rockstar_default` para que nginx
# pueda reenviar /api al servicio `api:3000`.

name: pos-rockstar

services:
  pos:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Nombre del servicio api dentro de la red rockstar_default.
      API_URL: http://api:3000
    ports:
      - "${POS_PUERTO:-8082}:80"
    networks:
      - rockstar
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  rockstar:
    name: rockstar_default
    external: true
